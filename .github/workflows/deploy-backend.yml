name: Deploy VaultDocs Server to Cloud Run

on:
  push:
    branches:
      - main # deploy only on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Authenticate to Google Cloud using service account
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Install Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: galvanic-tea-464714-j5
          export_default_credentials: true

      # 4. Verify authentication
      - name: Verify gcloud auth
        run: |
          gcloud auth list
          gcloud config list

      # 5. Build server Docker image (Fixed - no log streaming)
      - name: Build server Docker image
        run: |
          gcloud config set run/region us-central1
          
          echo "🚀 Submitting build to Cloud Build..."
          
          # Submit build without trying to stream logs
          BUILD_ID=$(gcloud builds submit ./server \
            --tag gcr.io/galvanic-tea-464714-j5/vaultdocs-backend \
            --format="value(id)" \
            --no-stream)
          
          echo "📋 Build submitted with ID: $BUILD_ID"
          echo "🔗 View logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID"
          
          # Wait for build completion with status checking
          echo "⏳ Waiting for build to complete..."
          
          MAX_ATTEMPTS=60  # 10 minutes max (60 * 10 seconds)
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            BUILD_STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)" 2>/dev/null || echo "UNKNOWN")
            echo "📊 Build status: $BUILD_STATUS (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            
            case $BUILD_STATUS in
              "SUCCESS")
                echo "✅ Build completed successfully!"
                echo "🐳 Docker image: gcr.io/galvanic-tea-464714-j5/vaultdocs-backend"
                exit 0
                ;;
              "FAILURE"|"TIMEOUT"|"CANCELLED")
                echo "❌ Build failed with status: $BUILD_STATUS"
                echo "🔍 Check build logs at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID"
                exit 1
                ;;
              "WORKING"|"QUEUED"|"UNKNOWN")
                echo "🔄 Build in progress..."
                ;;
            esac
            
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "⏰ Build timed out after 10 minutes"
          exit 1

      # 6. Deploy server to Cloud Run with environment variables
      - name: Deploy server to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          
          gcloud run deploy vaultdocs-backend \
            --image gcr.io/galvanic-tea-464714-j5/vaultdocs-backend \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 900 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --cpu-throttling \
            --execution-environment gen2 \
            --set-env-vars PORT=8080,GIN_MODE=release,MONGO_URI="${{ secrets.MONGO_URI }}",JWT_SECRET="${{ secrets.JWT_SECRET }}",GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}",GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}",GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME }}",GOOGLE_REDIRECT_URL="${{ secrets.GOOGLE_REDIRECT_URL }}",FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          
          echo "✅ Deployment completed successfully!"
          
          # Get the service URL
          SERVICE_URL=$(gcloud run services describe vaultdocs-backend \
            --region us-central1 \
            --format="value(status.url)")
          
          echo "🌐 Your service is available at: $SERVICE_URL"
          
          # Test the health endpoint
          echo "🔍 Testing health endpoint..."
          sleep 10
          curl -f "$SERVICE_URL/health" && echo "✅ Health check passed!" || echo "⚠️ Health check failed, but service might still be starting"