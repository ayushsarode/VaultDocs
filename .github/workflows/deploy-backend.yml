name: Deploy VaultDocs Server to Cloud Run

on:
  push:
    branches:
      - main # deploy only on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Authenticate to Google Cloud using service account
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Install Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: galvanic-tea-464714-j5
          export_default_credentials: true

      # 4. Configure Docker for Google Container Registry
      - name: Configure Docker for GCR
        run: |
          gcloud config set run/region us-central1
          gcloud auth configure-docker gcr.io
          echo "✅ Docker configured for GCR"

      # 5. Build and push Docker image
      - name: Build and push Docker image
        run: |
          cd ./server
          
          echo "🐳 Building Docker image..."
          docker build -t gcr.io/galvanic-tea-464714-j5/vaultdocs-backend .
          
          echo "📤 Pushing image to Google Container Registry..."
          docker push gcr.io/galvanic-tea-464714-j5/vaultdocs-backend
          
          echo "✅ Image built and pushed successfully!"

      # 6. Deploy to Cloud Run
      - name: Deploy server to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          
          gcloud run deploy vaultdocs-backend \
            --image gcr.io/galvanic-tea-464714-j5/vaultdocs-backend \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 900 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --cpu-throttling \
            --execution-environment gen2 \
            --set-env-vars GIN_MODE=release,MONGO_URI="${{ secrets.MONGO_URI }}", GOOGLE_REDIRECT_URL="${{ secrets.GOOGLE_REDIRECT_URL}}",JWT_SECRET="${{ secrets.JWT_SECRET }}",GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}",GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}",GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME }}",GOOGLE_REDIRECT_URL="${{ secrets.GOOGLE_REDIRECT_URL }}",FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          
          echo "✅ Deployment completed successfully!"
          
          # Get the service URL
          SERVICE_URL=$(gcloud run services describe vaultdocs-backend \
            --region us-central1 \
            --format="value(status.url)")
          
          echo "🌐 Your service is available at: $SERVICE_URL"
          echo "🔍 Health check: $SERVICE_URL/health"
          echo "🧪 Test endpoint: $SERVICE_URL/ping"
