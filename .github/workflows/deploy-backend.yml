name: Deploy VaultDocs Server to Cloud Run

on:
  push:
    branches:
      - main  # deploy only on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Authenticate to Google Cloud using service account
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Install Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: galvanic-tea-464714-j5
          export_default_credentials: true

      # 4. Verify authentication (optional but useful for debugging)
      - name: Verify gcloud auth
        run: |
          gcloud auth list
          gcloud config list

      # 5. Build server Docker image (only server folder)
      - name: Build server Docker image
        run: |
          gcloud config set run/region us-central1
          gcloud builds submit ./server \
            --tag gcr.io/galvanic-tea-464714-j5/vaultdocs-backend

      # 6. Deploy server to Cloud Run with environment variables
      - name: Deploy server to Cloud Run
        run: |
          gcloud run deploy vaultdocs-backend \
            --image gcr.io/galvanic-tea-464714-j5/vaultdocs-backend \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars DB_URL=${{ secrets.DB_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
